<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d1a2b" />
  <title>Hadsch-Pfad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Figtree:wght@400;600&family=Marcellus&display=swap" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <header id="hud">
    <div class="hud-row">
      <div>
        <div id="day" class="eyebrow"></div>
        <div id="title" class="title"></div>
      </div>
      <div id="dots"></div>
    </div>
    <div id="counter"></div>
  </header>

  <div id="toast" hidden></div>
  <div id="goal" hidden><span id="goalArrow">➤</span><span id="goalText"></span></div>
  <div id="stick" aria-hidden="true"><i></i></div>
  <div id="hint" hidden></div>
  <button id="prompt" type="button" hidden></button>

  <section id="choice" hidden aria-live="polite">
    <div class="choice-card">
      <p id="choiceQ"></p>
      <div id="choiceOpts"></div>
      <p id="choiceFb" hidden></p>
    </div>
  </section>

  <!-- Infokarte oben: kompakt, antippen klappt sie auf/zu -->
  <section id="panel" class="collapsed">
    <div class="panel-body">
      <div id="mission" hidden></div>
      <div id="info"></div>
      <div id="actions"></div>
    </div>
    <button id="panelToggle" type="button" aria-label="Text auf- oder zuklappen" hidden>mehr ▾</button>
  </section>

  <!-- Bedienung unten: links Joystick, rechts Halten und Autopilot -->
  <button id="hold" type="button" hidden>Halten</button>
  <button id="autoBtn" type="button" hidden>▶ Autopilot</button>

  <!-- Lernkarte: Einführung vor jeder Station und Zusammenfassung mit Quiz danach -->
  <section id="learn" hidden aria-live="polite">
    <div class="learn-card" id="learnCard"></div>
  </section>

  <!-- Zeigehinweis fürs Steuerungs-Training -->
  <div id="coach" hidden><span id="coachHand">👆</span><span id="coachText"></span></div>

  <div id="fade"></div>

  <button id="guideBtn" type="button" aria-label="Übersicht und Anleitung öffnen" title="Übersicht & Anleitung">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <section id="guide" hidden aria-label="Übersicht und Anleitung">
    <iframe id="guideFrame" title="Übersicht und Anleitung"></iframe>
    <button id="guideClose" type="button" aria-label="Übersicht schließen">✕</button>
  </section>

  <section id="start" class="screen">
    <div class="card">
      <div class="ar big">لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ</div>
      <h1>Hadsch-Pfad</h1>
      <p>Die Stationen der Pilgerfahrt in 3D. Gehe selbst: Joystick links (am Laptop W A S D), rechts wischen zum Umschauen.</p>
      <p id="disclaimer" class="small"></p>
      <!-- Profil: macht das Spiel persönlich. Wird nur auf diesem Gerät gespeichert. -->
      <form id="profile" autocomplete="off" onsubmit="return false">
        <label class="pf-row"><span>Dein Vorname</span><input id="pfName" type="text" maxlength="20" placeholder="z. B. Amina oder Yusuf" enterkeyhint="done"></label>
        <div class="pf-row"><span>Du bist</span>
          <div class="pf-seg" role="radiogroup" aria-label="Geschlecht">
            <button type="button" data-g="m" role="radio" aria-checked="false">Junge / Mann</button>
            <button type="button" data-g="f" role="radio" aria-checked="false">Mädchen / Frau</button>
          </div>
        </div>
        <label class="pf-row"><span>Dein Alter</span><select id="pfAge"></select></label>
        <p class="small pf-note">Wird nur auf diesem Gerät gespeichert – damit dich das Spiel mit Namen anspricht und die Regeln für dich passen.</p>
      </form>
      <button id="startBtn" class="primary" type="button">Bismillah – Beginnen</button>
      <div id="jump"></div>
    </div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
